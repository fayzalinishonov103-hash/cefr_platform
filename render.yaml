services:
  - type: web
    name: cefr-platform
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "python seed.py"
    startCommand: "gunicorn wsgi:app --workers 2 --timeout 300"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PROXY_HOPS
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cefr-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_WRITING_MODEL
        value: gpt-4o-mini
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: AI_GLOBAL_DAILY_CAP
        value: "0"
      - key: SPEAKING_PER_DAY
        value: "10"
      - key: LISTENING_PLAYS
        value: "2"
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: cefr-db
    databaseName: cefr
    user: levi
    plan: free
    region: frankfurt
