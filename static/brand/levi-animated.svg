<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="Levi - CEFR Prep" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <radialGradient id="eye" cx="50%" cy="60%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe6ff"/></radialGradient>
  <filter id="glow" x="-50%" y="-120%" width="200%" height="340%"><feGaussianBlur stdDeviation="7"/></filter>
  <style>
    .eyes, .halo, .lid { transform-box: fill-box; transform-origin: 50% 55%; }
    /* 1) eyes open from a thin slit, 2) they blink now and then, 3) the glow breathes */
    .open  { animation: open 1.1s cubic-bezier(.2,.8,.2,1) .3s both; }
    .lid   { animation: blink 5s ease-in-out 2.6s infinite; }
    .halo  { animation: breathe 2.8s ease-in-out 1.4s infinite alternate; opacity: .0; }
    .word  { animation: rise .9s ease-out 1.1s both; }
    .tag   { animation: rise .9s ease-out 1.6s both; }
    @keyframes open    { 0% { transform: scaleY(.04); opacity: 0; } 35% { opacity: 1; } 100% { transform: scaleY(1); opacity: 1; } }
    @keyframes blink   { 0%, 92%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.06); } }
    @keyframes breathe { from { opacity: .45; } to { opacity: 1; } }
    @keyframes rise    { from { opacity: 0; transform: translateY(10px); letter-spacing: .25em; } to { opacity: 1; transform: none; } }
    .open, .word, .tag { transform-box: fill-box; transform-origin: 50% 55%; }
    @media (prefers-reduced-motion: reduce) {
      .open, .lid, .halo, .word, .tag { animation: none !important; opacity: 1; transform: none; }
    }
  </style>
</defs>
<rect width="720" height="240" rx="24" fill="#05070a"/>
<g transform="translate(40 80) scale(1.25)">
  <g class="open">
    <g class="lid">
      <g class="halo" filter="url(#glow)">
        <path d="M10 14 L102 34 Q100 45 91 50 Q62 58 40 52 Q17 42 10 14 Z" fill="#4cc3ff"/>
        <path d="M210 14 L118 34 Q120 45 129 50 Q158 58 180 52 Q203 42 210 14 Z" fill="#4cc3ff"/>
      </g>
      <g class="eyes">
        <path d="M10 14 L102 34 Q100 45 91 50 Q62 58 40 52 Q17 42 10 14 Z" fill="url(#eye)" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
        <path d="M210 14 L118 34 Q120 45 129 50 Q158 58 180 52 Q203 42 210 14 Z" fill="url(#eye)" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</g>
<text class="word" x="330" y="132" font-family="Montserrat,'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="6" fill="#ffffff">LEVI</text>
<text class="tag" x="334" y="172" font-family="Montserrat,'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="9" fill="#7fc8ff">CEFR PREP</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
