# /etc/nginx/sites-available/levi   (keyin: sudo ln -s /etc/nginx/sites-available/levi /etc/nginx/sites-enabled/levi)
# "levi.example.uz" oʻrniga oʻz domeningizni yozing. HTTPS ni certbot oʻzi qoʻshadi (DEPLOY.md, 6-qadam).
server {
    listen 80;
    server_name levi.example.uz www.levi.example.uz;

    client_max_body_size 30m;                      # admin audio yuklash uchun

    location /static/ {                            # fayllarni nginx oʻzi beradi: ilovaga yuk tushmaydi
        alias /srv/levi/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;                   # AI baholash uzoq davom etishi mumkin
    }
}
